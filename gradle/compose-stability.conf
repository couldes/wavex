// Compose 稳定性声明（编译器输入，不是依赖）
//
// 为什么需要这个文件：:core:domain 是纯 Kotlin/JVM 模块（spec §3 要求它不依赖
// Android/Compose），因此没有 Compose 编译器插件，它产出的类不带 @Stable 元数据。
// 消费方（feature/app）编译时只能保守推断为 unstable → 含这些类型参数的
// composable 无法跳过重组。
//
// 这里显式声明「这些类是不可变的」，效果等价于在类上加 @Immutable，
// 但不给 :core:domain 引入任何 Compose 依赖。
//
// 准入条件（每条都已逐类核验）：
//   1. 所有字段是 val，无普通 var
//   2. 不含 MutableList/MutableMap/MutableSet/HashMap 等可变容器
//   3. 更新走 copy() 产生新实例，不存在原地修改
// 不满足者一律不得加入：错标 stable 会让 Compose 跳过本该刷新的重组 → 界面陈旧。
// 例如 AgentConversation 含 lastActiveAt/pinned/archived 等普通 var，明确排除。
// 又例如 StreamErrorCode 继承 Exception，Throwable 的 stackTrace/cause/
// suppressedExceptions 是可变状态，不满足条件 1，同样排除。

